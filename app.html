<style>
:root{
  --navy:#1A2E44; --teal:#00838F; --gold:#C49A2B; --grey:#5A6672;
  --ink:#16202c; --mute:#6b7785; --line:#d9dee4; --bg:#f4f6f8; --card:#fff;
  --bad:#B3261E; --good:#1E7B34;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;overflow-x:hidden}
input,select,button,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hide{display:none !important}

/* ---------- sign in ---------- */
.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
      background:linear-gradient(170deg,#16293d,#0e1a28)}
.gatebox{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px 24px 24px;
         box-shadow:0 18px 50px rgba(0,0,0,.35)}
.gatebox img.mark{width:84px;height:84px;display:block;margin:0 auto 14px;border-radius:50%}
.gatebox h1{font-size:19px;margin:0 0 2px;text-align:center;color:var(--navy)}
.gatebox p.sub{margin:0 0 20px;text-align:center;color:var(--mute);font-size:13.5px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--grey);margin-bottom:4px}
.fld input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;min-height:46px}
.fld input:focus{outline:2px solid var(--teal);outline-offset:1px}
.btn{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--teal);color:#fff;
     font-weight:700;font-size:16px;cursor:pointer}
.btn.alt{background:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.linky{background:none;border:0;color:var(--teal);font-weight:600;cursor:pointer;padding:6px;font-size:13.5px}
.gatefoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.msg{padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:12px;display:none}
.msg.err{display:block;background:#fdeceb;color:#8b1a1a;border:1px solid #f2c9c5}
.msg.ok{display:block;background:#e8f5ec;color:#15602a;border:1px solid #bfe2cb}
.msg.info{display:block;background:#eaf4f6;color:#15606b;border:1px solid #c3e0e5}

/* ---------- chrome ---------- */
header{background:var(--navy);color:#fff;padding:10px 0;border-bottom:3px solid var(--gold)}
.hrow{display:flex;align-items:center;gap:12px}
.hrow img{width:44px;height:44px;border-radius:50%;flex:0 0 auto}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-size:15px;line-height:1.2}
.hrow .t span{font-size:11.5px;color:#9fb0c2}
.who{font-size:11.5px;color:#9fb0c2;text-align:right;line-height:1.3}
.who b{display:block;color:#fff;font-size:13px}
.iconbtn{background:#23384f;border:1px solid #3c5068;color:#cfe0ee;border-radius:8px;
         min-height:38px;padding:0 11px;cursor:pointer;font-size:13px;font-weight:600}

nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25}
.tabsin{display:flex;gap:2px;overflow-x:auto}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;
     cursor:pointer;color:var(--grey);font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--teal)}
.tab .amt{display:block;font-size:11px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}

<body>

<!-- ============================ sign in ============================ -->
<div class="gate" id="gate">

    <div class="msg" id="gateMsg"></div>

      <div class="fld"><label for="gEmail">Email</label>
        <input id="gEmail" type="email" autocomplete="username" required></div>
      <div class="fld" id="gPwWrap"><label for="gPw">Password</label>
        <input id="gPw" type="password" autocomplete="current-password" required></div>

<!-- ============================ app ============================ -->

  <header><div class="wrap hrow">

<script>
(function(){
"use strict";

/* =====================================================================
   BVI Artisans Onboard
   One page, three roles. Offline-first: the till never waits on the
   network. Sales are written to a local queue with ids made on the
   device, then pushed to Supabase whenever there is a signal.
   ===================================================================== */

var SUPA_URL = 'https://sqkklyoaugwxyfqfqumd.supabase.co';
var SUPA_KEY = 'sb_publishable_ywE3IxPNSIo75gO23EL-6Q__0hxuIEX';

var K = {
  sess:  'ao.session',
  prof:  'ao.profile',
  cache: 'ao.cache',
  queue: 'ao.queue',
  local: 'ao.local',
  dev:   'ao.device'
};

/* ----------------------------------------------------------- storage */
function ls(k, v){
  try{
    if(v === undefined){ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }
    if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  }catch(e){ return null; }
}
function uuid(){
  if(crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r = Math.random()*16|0, v = c==='x'? r : (r&0x3|0x8); return v.toString(16);
  });
}
var deviceId = ls(K.dev) || (function(){ var d = uuid().slice(0,8); ls(K.dev, d); return d; })();

/* ----------------------------------------------------------- helpers */
function el(id){ return document.getElementById(id); }
function mk(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function setText(id,v){ var n=el(id); if(n) n.textContent=v; }
function money(n){ return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
function hhmm(ts){ var d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ----------------------------------------------------------- the API */
var session = ls(K.sess);

function authFetch(path, opts){
  opts = opts || {};
  var h = Object.assign({
    'apikey': SUPA_KEY,
    'Content-Type': 'application/json'
  }, opts.headers || {});
  if(session && session.access_token) h['Authorization'] = 'Bearer ' + session.access_token;
  return fetch(SUPA_URL + path, Object.assign({}, opts, {headers:h}));
}

function api(path, opts){
  return authFetch(path, opts).then(function(r){
    if(r.status === 401 && session && session.refresh_token){
      return refreshSession().then(function(ok){
        if(!ok) throw new Error('Session expired — please sign in again.');
        return authFetch(path, opts);
      }).then(handle);
    }
    return handle(r);
  });
  function handle(r){
    if(!r.ok) return r.text().then(function(t){
      var m = t; try{ var j=JSON.parse(t); m = j.message || j.error_description || j.msg || t; }catch(e){}
      throw new Error(m || ('Request failed ('+r.status+')'));
    });
    if(r.status === 204) return null;
    return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  }
}
function rest(path, opts){ return api('/rest/v1' + path, opts); }

function saveSession(s){
  if(s && s.access_token){
    s.expires_at = Date.now() + ((s.expires_in || 3600) * 1000);
    session = s; ls(K.sess, s);
  }
}
function refreshSession(){
  if(!session || !session.refresh_token) return Promise.resolve(false);
  return fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: session.refresh_token})
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(j && j.access_token){ saveSession(j); return true; } return false; })
    .catch(function(){ return false; });
}
function signIn(email, password){
  return fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
    method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email:email, password:password})
  }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description||j.msg||'Sign-in failed'); return j; }); })
    .then(function(j){ saveSession(j); return j; });
}
function signUp(email, password){
  return fetch(SUPA_URL + '/auth/v1/signup', {
    method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email:email, password:password})
  }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Could not create the account'); return j; }); });
}
function resetPassword(email){
  return fetch(SUPA_URL + '/auth/v1/recover', {
    method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email:email, redirect_to: location.href.split('#')[0]})
  }).then(function(r){ if(!r.ok) return r.json().then(function(j){ throw new Error(j.msg||'Could not send the email'); }); });
}
function updatePassword(pw){
  return api('/auth/v1/user', {method:'PUT', body: JSON.stringify({password: pw})});
}
function signOut(){
  ls(K.sess,null); ls(K.prof,null); session = null;
  location.hash = ''; location.reload();
}

/* ------------------------------------------------------- app state */
var profile = ls(K.prof) || null;
var cache   = ls(K.cache) || {artisans:[], products:[], calls:[], stock:[], at:0};
var queue   = ls(K.queue) || [];       // transactions waiting to be pushed
var local   = ls(K.local) || {callId:null, sales:[], basket:[]};
var online  = navigator.onLine;

function saveCache(){ ls(K.cache, cache); }
function saveQueue(){ ls(K.queue, queue); }
function saveLocal(){ ls(K.local, local); }

function artisanById(id){ for(var i=0;i<cache.artisans.length;i++) if(cache.artisans[i].id===id) return cache.artisans[i]; return null; }
function productById(id){ for(var i=0;i<cache.products.length;i++) if(cache.products[i].id===id) return cache.products[i]; return null; }
function currentCall(){
  var open = cache.calls.filter(function(c){ return c.status==='open'; })[0];
  if(open) return open;
  var t = todayISO();
  var today = cache.calls.filter(function(c){ return c.call_date===t; })[0];
  if(today) return today;
  var next = cache.calls.filter(function(c){ return c.call_date >= t && c.status!=='closed'; })
                        .sort(function(a,b){ return a.call_date<b.call_date?-1:1; })[0];
  return next || cache.calls[cache.calls.length-1] || null;
}
function stockFor(productId){
  var call = currentCall(); if(!call) return null;
  for(var i=0;i<cache.stock.length;i++){
    var s = cache.stock[i];
    if(s.product_id===productId && s.port_call_id===call.id){
      return (s.confirmed_qty!=null) ? s.confirmed_qty : s.declared_qty;
    }
  }
  return null;
}
function prettyDate(iso){
  if(!iso) return '—';
  var d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

  ]).then(function(r){

    cache.at = Date.now(); saveCache();

/* ------------------------------------------------------------ sync */
function pushQueue(){
  if(!online || !queue.length || !session) return Promise.resolve();
  var job = queue[0];
  return rest('/transactions', {method:'POST', headers:{'Prefer':'resolution=merge-duplicates'},
                                body: JSON.stringify(job.txn)})
    .then(function(){
      return rest('/sale_lines', {method:'POST', headers:{'Prefer':'resolution=merge-duplicates'},
                                  body: JSON.stringify(job.lines)});
    })
    .then(function(){
      if(job.preorders && job.preorders.length)
        return rest('/preorders', {method:'POST', body: JSON.stringify(job.preorders)});
    })
    .then(function(){
      queue.shift(); saveQueue(); paintSync();
      if(queue.length) return pushQueue();
    })
    .catch(function(e){
      // leave it queued; a sale is never lost because the network blinked
      console.warn('sync held:', e.message);
      paintSync();
    });
}
function paintSync(){
  var p = el('syncPill'); if(!p) return;
  if(!online){ p.className='sync off'; p.textContent = queue.length ? ('Offline · '+queue.length+' held') : 'Offline'; return; }
  if(queue.length){ p.className='sync pending'; p.textContent = queue.length+' to send'; return; }
  p.className='sync ok'; p.textContent='Saved';
}
window.addEventListener('online',  function(){ online=true;  paintSync(); pushQueue(); });
window.addEventListener('offline', function(){ online=false; paintSync(); });
setInterval(function(){ if(online && queue.length) pushQueue(); }, 20000);

function gateMsg(kind, text){

el('gForgot').onclick = function(){
  var email = el('gEmail').value.trim();
  if(!email){ gateMsg('err','Enter your email address first, then press Forgot password.'); return; }
  resetPassword(email)
    .then(function(){ gateMsg('ok','Check your email for a link to set a new password.'); })
    .catch(function(e){ gateMsg('err', e.message); });
};

el('gateForm').onsubmit = function(e){
  e.preventDefault();
  var email = el('gEmail').value.trim(), pw = el('gPw').value, pw2 = el('gPw2').value;
  gateMsg('');
  el('gSubmit').disabled = true;

  var done = function(){ el('gSubmit').disabled = false; };

  if(gateMode === 'signin'){
    signIn(email, pw).then(start).catch(function(err){ gateMsg('err', err.message); done(); });
    return;
  }
  if(pw.length < 12){ gateMsg('err','Please use at least 12 characters.'); done(); return; }
  if(pw !== pw2){ gateMsg('err','The two passwords do not match.'); done(); return; }

  if(gateMode === 'signup'){
    signUp(email, pw).then(function(j){
      if(j && j.access_token){ saveSession(j); start(); }
      else { gateMsg('ok','Account created. Check your email to confirm it, then sign in.'); setGateMode('signin'); done(); }
    }).catch(function(err){ gateMsg('err', err.message); done(); });
    return;
  }
  // setpw — arrived from an invitation or reset link
  updatePassword(pw).then(function(){
    gateMsg('ok','Password set. Signing you in…');
    setTimeout(start, 600);
  }).catch(function(err){ gateMsg('err', err.message); done(); });
};

/* a recovery or invite link drops tokens in the URL fragment */
function consumeHash(){
  var h = location.hash || '';
  if(h.indexOf('access_token=') === -1) return false;
  var p = {};
  h.replace(/^#/,'').split('&').forEach(function(kv){
    var i = kv.indexOf('='); p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1));
  });
  if(!p.access_token) return false;
  saveSession({access_token:p.access_token, refresh_token:p.refresh_token, expires_in:Number(p.expires_in||3600)});
  history.replaceState(null,'',location.pathname + location.search);
  return (p.type === 'recovery' || p.type === 'invite');
}

function itemStats(p){
  var card=0, cash=0, val=0;
  local.sales.forEach(function(s){
    if(s.product_id !== p.id) return;
    if(s.method==='card') card += s.qty; else cash += s.qty;
    val += s.qty * s.unit_price;
  });
  return {card:card, cash:cash, n:card+cash, value:val};
}
function bizStats(bid){
  var t={n:0,value:0,cardValue:0,cashValue:0,left:0,hasStock:false};
  cache.products.forEach(function(p){
    if(p.artisan_id!==bid) return;
    var st = itemStats(p), stock = stockFor(p.id);
    t.n += st.n; t.value += st.value;
    if(stock!=null){ t.hasStock=true; t.left += Math.max(0, stock - st.n); }
  });
  local.sales.forEach(function(s){
    var p = productById(s.product_id); if(!p || p.artisan_id!==bid) return;
    if(s.method==='card') t.cardValue += s.qty*s.unit_price; else t.cashValue += s.qty*s.unit_price;
  });
  return t;
}
function grandStats(){
  var g={n:0,value:0,cardValue:0,cashValue:0};
  local.sales.forEach(function(s){
    var v = s.qty*s.unit_price;
    g.n += s.qty; g.value += v;
    if(s.method==='card') g.cardValue += v; else g.cashValue += v;
  });
  return g;
}
function transactions(){
  var order=[], by={};
  local.sales.forEach(function(s){
    if(!by[s.txn]){ by[s.txn]={tid:s.txn, ts:s.ts, method:s.method, n:0, total:0, lines:[], queued:isQueued(s.txn)}; order.push(s.txn); }
    var g = by[s.txn];
    g.n += s.qty; g.total += s.qty*s.unit_price;
    var p = productById(s.product_id);
    g.lines.push({name: p?p.name:'(removed)', qty:s.qty});
  });
  return order.map(function(t){ return by[t]; });
}
function isQueued(tid){ return queue.some(function(j){ return j.txn.id === tid; }); }

function recordSale(lines, method, preorderData){
  var call = currentCall();
  if(!call){ alert('No port call is set up. Ask David to open one.'); return null; }
  var tid = uuid(), now = new Date().toISOString(), total = 0;
  var dbLines = [], preorders = [];
  lines.forEach(function(l){
    var p = productById(l.productId); if(!p) return;
    total += l.qty * p.price;
    dbLines.push({id:uuid(), transaction_id:tid, product_id:p.id, artisan_id:p.artisan_id,
                  qty:l.qty, unit_price:p.price});
    local.sales.push({txn:tid, product_id:p.id, qty:l.qty, unit_price:p.price,
                      method:method, ts:Date.now()});
    if(p.preorder && preorderData && preorderData[p.id]){
      var c = preorderData[p.id];
      preorders.push({port_call_id:call.id, product_id:p.id, artisan_id:p.artisan_id,
                      qty:l.qty, unit_price:p.price, customer_name:c.name,
                      customer_email:c.email||null, customer_phone:c.phone||null,
                      customer_cabin:c.cabin||null, notes:c.notes||null,
                      taken_by: profile.id});
    }
  });
  var txn = {id:tid, port_call_id:call.id, method:method, total:Math.round(total*100)/100,
             sold_at:now, recorded_by:profile.id, device_id:deviceId};
  queue.push({txn:txn, lines:dbLines, preorders:preorders});
  saveQueue(); saveLocal(); refresh(); pushQueue();
  return {tid:tid, total:total, n:dbLines.reduce(function(a,l){return a+l.qty;},0)};
}
function quickSell(prod, method){
  if(prod.preorder){ openPreorder(prod, method); return; }
  recordSale([{productId:prod.id, qty:1}], method);
}
function undoLast(prod){
  for(var i=local.sales.length-1;i>=0;i--){
    if(local.sales[i].product_id === prod.id){ voidTxn(local.sales[i].txn); return; }
  }
}
function voidTxn(tid){
  local.sales = local.sales.filter(function(s){ return s.txn !== tid; });
  saveLocal();
  var q = queue.findIndex(function(j){ return j.txn.id === tid; });
  if(q > -1){ queue.splice(q,1); saveQueue(); refresh(); return; }   // never left the device
  // already sent: mark it voided on the server
  rest('/transactions?id=eq.'+tid, {method:'PATCH',
       body: JSON.stringify({voided:true, voided_at:new Date().toISOString(), voided_by:profile.id})})
    .catch(function(){ /* it will still show as voided locally */ });
  refresh();
}

    : '<div class="lockbar open">Open for changes until 72 hours before <b>'+esc(prettyDate(call.call_date))+'</b>.</div>');

  box.innerHTML = '';
  var mine = cache.products.filter(function(p){ return p.artisan_id === profile.artisan_id; });
  if(!mine.length) box.appendChild(mk('p','hint','No products yet. Add your first below.'));

  mine.forEach(function(prod){
    var r = mk('div','row');
    var lc = mk('div');
    var nm = mk('input'); nm.value = prod.name; nm.className='search'; nm.style.marginBottom='6px';
    nm.disabled = locked;
    nm.onchange = function(){ patchProduct(prod, {name: nm.value.trim()}); };
    lc.appendChild(nm);

    var fields = mk('div','fields');
    var fp = mk('label','f'); fp.appendChild(mk('span',null,'Price $'));
    var pi = mk('input'); pi.type='number'; pi.min='0'; pi.step='0.01'; pi.value = prod.price; pi.disabled = locked;
    pi.onchange = function(){ patchProduct(prod, {price: Number(pi.value)||0}); };
    fp.appendChild(pi); fields.appendChild(fp);

    var fq = mk('label','f'); fq.appendChild(mk('span',null,'Bringing'));
    var qi = mk('input'); qi.type='number'; qi.min='0'; qi.step='1'; qi.disabled = locked;
    var dec = cache.stock.filter(function(s){ return s.product_id===prod.id && call && s.port_call_id===call.id; })[0];
    qi.value = dec && dec.declared_qty!=null ? dec.declared_qty : '';
    qi.placeholder = prod.preorder ? 'P/O' : '0';
    qi.onchange = function(){ declareStock(prod, qi.value===''?null:Number(qi.value)); };
    fq.appendChild(qi); fields.appendChild(fq);

    if(dec && dec.confirmed_qty!=null){
      var c = mk('span','f','Confirmed aboard: '+dec.confirmed_qty);
      c.style.color = (dec.declared_qty!=null && dec.confirmed_qty!==dec.declared_qty) ? 'var(--bad)' : 'var(--good)';
      fields.appendChild(c);
    }
    lc.appendChild(fields);
    r.appendChild(lc);

    var right = mk('div','acts');
    var po = mk('button','tbtn', prod.preorder ? 'Pre-order' : 'In stock'); po.type='button'; po.disabled = locked;
    po.onclick = function(){ patchProduct(prod, {preorder: !prod.preorder}).then(renderMine); };
    var ac = mk('button','tbtn'+(prod.active?'':' danger'), prod.active ? 'Listed' : 'Hidden'); ac.type='button';
    ac.disabled = locked;
    ac.onclick = function(){ patchProduct(prod, {active: !prod.active}).then(renderMine); };
    right.appendChild(po); right.appendChild(ac);
    r.appendChild(right);
    box.appendChild(r);
  });

  el('newAdd').disabled = locked;
  el('newAdd').onclick = function(){
    var name = el('newName').value.trim(); if(!name) return;
    var price = Number(el('newPrice').value) || 0;
    var qty = el('newQty').value === '' ? null : Number(el('newQty').value);
    rest('/products', {method:'POST', headers:{'Prefer':'return=representation'},
      body: JSON.stringify({artisan_id: profile.artisan_id, name:name, price:price,
                            preorder: qty===null, sort: 900})})
      .then(function(rows){
        var prod = rows[0]; cache.products.push(prod); saveCache();
        el('newName').value=''; el('newPrice').value=''; el('newQty').value='';
        if(qty!==null) return declareStock(prod, qty);
      })
      .then(renderMine)
      .catch(function(e){ alert('Could not add it: '+e.message); });
  };
}
function patchProduct(prod, patch){
  return rest('/products?id=eq.'+prod.id, {method:'PATCH', body: JSON.stringify(patch)})
    .then(function(){ Object.assign(prod, patch); saveCache(); })
    .catch(function(e){ alert('Could not save: '+e.message); });
}
function declareStock(prod, qty){
  var call = currentCall(); if(!call) return Promise.resolve();
  var body = {port_call_id:call.id, product_id:prod.id, artisan_id:prod.artisan_id,
              declared_qty:qty, declared_by:profile.id, declared_at:new Date().toISOString()};
  return rest('/stock_declarations?on_conflict=port_call_id,product_id',
    {method:'POST', headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
     body: JSON.stringify(body)})
    .then(function(rows){
      var row = rows && rows[0]; if(!row) return;
      var i = cache.stock.findIndex(function(s){ return s.product_id===prod.id && s.port_call_id===call.id; });
      if(i>-1) cache.stock[i] = row; else cache.stock.push(row);
      saveCache();
    })
    .catch(function(e){ alert('Could not save the quantity: '+e.message); });
}

        var tr = mk('tr');

                       '</td><td>'+(p?'<b style="color:var(--good)">signed up</b>':'invited')+'</td>';

        if(invs.some(function(iv){ return (iv.email||'').toLowerCase() === (p.email||'').toLowerCase(); })) return;
        var a = p.artisan_id ? artisanById(p.artisan_id) : null;
        var tr = mk('tr');
        tr.innerHTML = '<td>'+esc(p.email)+'</td><td>'+esc(p.role)+'</td><td>'+esc(a?a.name:'—')+

                artisan_id: el('invArtisan').value || null,
                full_name: el('invName').value.trim() || null};

      .catch(function(e){ alert(e.message); });

      ss.innerHTML = ''; ss.appendChild(t);
    })
    .catch(function(e){ ss.innerHTML = '<p class="hint">'+esc(e.message)+'</p>'; });
}

   NEW SALE SHEET
   ==================================================================== */
var pickBiz = 'all', toastTimer = null;

function basketQty(id){ for(var i=0;i<local.basket.length;i++) if(local.basket[i].productId===id) return local.basket[i].qty; return 0; }
function basketSet(id,q){
  for(var i=0;i<local.basket.length;i++){
    if(local.basket[i].productId===id){ if(q<=0) local.basket.splice(i,1); else local.basket[i].qty=q; saveLocal(); return; }
  }
  if(q>0) local.basket.push({productId:id, qty:q});
  saveLocal();
}
function basketTotal(){
  var t=0; local.basket.forEach(function(l){ var p=productById(l.productId); if(p) t += p.price*l.qty; }); return t;
}
function openSale(){ el('saleOvl').hidden=false; document.body.style.overflow='hidden'; renderFilters(); renderPicker(); renderBasket(); }
function closeSale(){ el('saleOvl').hidden=true; document.body.style.overflow=''; }

function renderFilters(){
  var box = el('saleFilters'); box.innerHTML='';
  [{id:'all',name:'All artisans'}].concat(cache.artisans).forEach(function(b){
    var c = mk('button','fchip'+(pickBiz===b.id?' on':''), b.name); c.type='button';
    c.onclick = function(){ pickBiz=b.id; renderFilters(); renderPicker(); };
    box.appendChild(c);
  });
}
function renderPicker(){
  var list = el('salePicker'); list.innerHTML='';
  var qs = (el('saleSearch').value||'').trim().toLowerCase();
  var pool = cache.products.filter(function(p){ return p.active && (pickBiz==='all' || p.artisan_id===pickBiz); });
  var items = pool, fallback = false;
  if(qs){
    items = pool.filter(function(p){ return p.name.toLowerCase().indexOf(qs)>-1; });
    if(!items.length){
      items = pool.filter(function(p){
        var a = artisanById(p.artisan_id);
        return ((a?a.name:'')+' '+(a?a.search_tags:'')).toLowerCase().indexOf(qs)>-1;
      });
      fallback = items.length>0;
    }
  }
  if(fallback){
    var n = mk('div','bempty','No product is called “'+qs+'” — showing the artisans that match.');
    n.style.textAlign='left'; list.appendChild(n);
  }
  items.forEach(function(p){
    var a = artisanById(p.artisan_id), st = itemStats(p), stock = stockFor(p.id);
    var left = stock==null ? null : Math.max(0, stock - st.n - basketQty(p.id));
    var row = mk('div','pitem');
    var nm = mk('div','pn'); nm.appendChild(document.createTextNode(p.name));
    var sub = mk('small','pb');
    sub.appendChild(document.createTextNode((a?a.name:'') + (p.preorder ? ' · pre-order' : '')));
    if(left!==null) sub.appendChild(mk('span', left===0?'lo':'', ' · '+left+' left'));
    nm.appendChild(sub); row.appendChild(nm);
    row.appendChild(mk('div','pp', money(p.price)));
    var inb = basketQty(p.id);
    var add = mk('button','padd'+(inb?' inb':''), inb ? String(inb) : '+'); add.type='button';
    add.onclick = function(){ basketSet(p.id, basketQty(p.id)+1); renderPicker(); renderBasket(); };
    row.appendChild(add);
    list.appendChild(row);
  });
  if(!items.length) list.appendChild(mk('div','bempty','Nothing matches. Clear the search, or check the artisan filter.'));
}
function renderBasket(){
  var box = el('saleBasket'); box.innerHTML='';
  if(!local.basket.length)
    box.appendChild(mk('div','bempty','Tap products above to build the sale — several products, one customer, one payment.'));
  local.basket.forEach(function(l){
    var p = productById(l.productId); if(!p) return;
    var a = artisanById(p.artisan_id);
    var row = mk('div','bl');
    var nm = mk('div','bn'); nm.appendChild(document.createTextNode(p.name));
    nm.appendChild(mk('small',null,(a?a.name:'')+' · '+money(p.price)+' each'));
    row.appendChild(nm);
    var q = mk('div','qty');
    var mi = mk('button',null,'−'); mi.type='button';
    mi.onclick = function(){ basketSet(l.productId,l.qty-1); renderPicker(); renderBasket(); };
    var cn = mk('span',null,String(l.qty));
    var pl = mk('button',null,'+'); pl.type='button';
    pl.onclick = function(){ basketSet(l.productId,l.qty+1); renderPicker(); renderBasket(); };
    q.appendChild(mi); q.appendChild(cn); q.appendChild(pl);
    row.appendChild(q);
    row.appendChild(mk('div','lt', money(p.price*l.qty)));
    box.appendChild(row);
  });
  setText('saleTotal', money(basketTotal()));
  el('payCard').disabled = !local.basket.length;
  el('payCash').disabled = !local.basket.length;
}
function completeSale(method){
  if(!local.basket.length) return;
  var lines = local.basket.map(function(l){ return {productId:l.productId, qty:l.qty}; });
  var hasPre = lines.some(function(l){ var p=productById(l.productId); return p && p.preorder; });
  if(hasPre){
    alert('This basket includes a pre-order. Take those on their own so the customer’s details can be recorded.');
    return;
  }
  var r = recordSale(lines, method);
  if(!r) return;
  local.basket = []; saveLocal();
  renderBasket(); renderPicker(); closeSale();
  showToast(r.n + (r.n===1?' item':' items') + ' · ' + money(r.total) + ' ' + (method==='card'?'by card':'in cash'),
            function(){ voidTxn(r.tid); });
}
function showToast(msg, undo){
  setText('toastMsg', msg);
  el('toastUndo').onclick = function(){ undo(); hideToast(); };
  el('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 7000);
}
function hideToast(){ el('toast').hidden = true; clearTimeout(toastTimer); }

/* ====================================================================
   REFRESH
   ==================================================================== */
function refresh(){
  if(isTill()){
    cache.products.forEach(function(p){
      var e = rowEls[p.id]; if(!e) return;
      var st = itemStats(p), stock = stockFor(p.id);
      e.v.textContent = money(st.value);
      var bits = st.n + ' sold';
      if(st.n) bits += ' (' + st.card + ' cc / ' + st.cash + ' cash)';
      if(stock != null) bits += ' · ' + Math.max(0, stock - st.n) + ' left';
      e.d.textContent = bits;
      e.stockLbl.textContent = stock==null ? (p.preorder ? 'Pre-order' : 'No stock declared') : ('On board ' + stock);
      var over = stock != null && st.n > stock;
      e.row.classList.toggle('oos', over);
      e.flag.style.display = over ? 'block' : 'none';
      if(over) e.flag.textContent = 'More sold than was confirmed aboard.';
      e.undo.disabled = st.n === 0;
    });
    cache.artisans.forEach(function(b){
      var t = bizStats(b.id);
      setText('bz-'+b.id+'-value', money(t.value));
      setText('bz-'+b.id+'-card',  money(t.cardValue));
      setText('bz-'+b.id+'-cash',  money(t.cashValue));
      setText('bz-'+b.id+'-n',     String(t.n));
      setText('bz-'+b.id+'-left',  t.hasStock ? String(t.left) : '—');
      setText('tabamt-'+b.id, money(t.value));
    });
    var g = grandStats();
    setText('sTotal', money(g.value)); setText('sCard', money(g.cardValue));
    setText('sCash',  money(g.cashValue)); setText('sItems', String(g.n));
    setText('tabamt-overview', money(g.value));
    if(activeTab === 'overview') renderOverview();
  }
  paintSync();
}

/* ------------------------------------------------------------- CSV */
function q(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(){
  var call = currentCall();
  var rows = [['Row','Port call','Ship','Recorded by','Artisan','Product','Unit price','On board','Sold','Left','Value $']];
  cache.artisans.forEach(function(a){
    cache.products.forEach(function(p){
      if(p.artisan_id!==a.id) return;
      var st = itemStats(p), stock = stockFor(p.id);
      if(!st.n && stock==null) return;
      rows.push(['ITEM', call?call.call_date:'', call?call.ship:'', profile.full_name||profile.email,
                 a.name, p.name, p.price, stock==null?'P/O':stock, st.n,
                 stock==null?'':Math.max(0,stock-st.n), st.value.toFixed(2)]);
    });
    var t = bizStats(a.id);
    rows.push(['ARTISAN TOTAL', call?call.call_date:'', call?call.ship:'', '', a.name, '', '', '', t.n, '', t.value.toFixed(2)]);
  });
  var g = grandStats();
  rows.push(['GRAND TOTAL', call?call.call_date:'', call?call.ship:'', '', 'All artisans','','','',g.n,'',g.value.toFixed(2)]);
  rows.push(['CARD','','','','','','','','','',g.cardValue.toFixed(2)]);
  rows.push(['CASH','','','','','','','','','',g.cashValue.toFixed(2)]);
  var csv = rows.map(function(r){ return r.map(q).join(','); }).join('\n');
  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'artisans-sales-' + (call?call.call_date:todayISO()) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
